name: Targeted Windows layout startup diagnostic
on:
  push:
    branches: [test/20261019-layout-startup-diagnostic]
    paths:
      - '.github/workflows/layout-startup-diagnostic.yml'
      - 'scripts/layout-startup-diagnostic.mjs'
permissions:
  contents: read
# Separate evidence only. No full regression, packaging, cancellation, or release.
defaults:
  run:
    shell: pwsh
jobs:
  diagnose-startup:
    if: github.repository == 'offercontext/offerPilot' && github.ref == 'refs/heads/test/20261019-layout-startup-diagnostic' && github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      LAYOUT_SOURCE_SHA: '9a486828d31779ad277c48817c0867b0c82122fb'
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9a486828d31779ad277c48817c0867b0c82122fb
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/installed-ui/package-lock.json
      - name: Verify immutable source and bounded diagnostic scope
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $actual = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:LAYOUT_SOURCE_SHA) { throw 'Unexpected source SHA' }
          @(
            "Source: $actual",
            "Diagnostic: $env:GITHUB_SHA",
            'Original failing run: 39299451507, job 118220478723.',
            'Candidate test isolation only: real coverage-model tests, then one cold/warm 900x689-0-failure pair; verify no shared deps cache or reload.',
            'Original 15000ms readiness threshold, passed assertion and fallback interactions retained.',
            'This diagnostic does not replace the original failure or the complete gate.',
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content evidence/scope.txt
          Get-FileHash -Algorithm SHA256 source/web/package-lock.json, source/desktop/installed-ui/package-lock.json, source/web/tests/desktop-layout/run.mjs, source/web/tests/desktop-layout/fixture.tsx, source/web/vite.config.ts | Format-List | Out-File evidence/source-sha256.txt
          node --version | Set-Content evidence/node-version.txt
          node --check diagnostic/scripts/layout-startup-diagnostic.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic syntax failed' }
      - name: Install unchanged locked browser dependencies
        run: |
          npm.cmd ci --prefix source/web
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed' }
          npm.cmd ci --prefix source/desktop/installed-ui --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Original isolated helper install failed' }
      - name: Match original build and fixture type prerequisites
        run: |
          npm.cmd run build --prefix source/web
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          node source/web/node_modules/typescript/bin/tsc --project source/web/tests/desktop-layout/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Fixture type check failed' }
      - name: Verify redacted diagnostics and actual 15-second negative control
        env:
          LAYOUT_BROWSER_NEGATIVE: '1'
        run: |
          $env:LAYOUT_NEGATIVE_EVIDENCE_DIR = Join-Path $PWD 'evidence/negative-control'
          node --test source/desktop/installed-ui/test/layout-failure-evidence.test.mjs 2>&1 | Tee-Object evidence/failure-evidence-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Failure evidence controls failed' }
      - name: Capture cold and warm initialization evidence
        run: |
          node diagnostic/scripts/layout-startup-diagnostic.mjs source evidence prime-coverage
          if ($LASTEXITCODE -ne 0) { throw 'Targeted layout diagnostic found a failure; original threshold retained' }
      - name: Verify product source stayed unchanged
        if: always()
        run: |
          git -C source diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source changed during diagnostic' }
      - name: Preserve startup evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-isolation-9a48682-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
